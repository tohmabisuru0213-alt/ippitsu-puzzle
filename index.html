<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一筆パズル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f3f3f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}body{display:flex;justify-content:center}#app{width:min(92vw,520px);padding:22px 0 36px}h1{text-align:center;margin:0 0 8px}.rule{text-align:center;font-size:14px;line-height:1.6;margin-bottom:18px}
#board{position:relative;width:100%;aspect-ratio:1;background:#fff;border:3px solid #222;overflow:hidden;touch-action:none}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}.cell{border-right:1px solid #aaa;border-bottom:1px solid #aaa;background:#fff}.cell:nth-child(5n){border-right:0}.cell:nth-child(n+21){border-bottom:0}
.cell.current{background:#d9eaff}.cell.filled1{background:#ffb3b3}.cell.filled2{background:#b9d5ff}.cell.filled3{background:#bce8cf}.cell.filled4{background:#ffe0a8}.cell.filled5{background:#d9bdf2}
.wall{position:absolute;background:#111;z-index:10;pointer-events:none}.wall-v{width:10px;top:0;height:20%}.wall-h{height:10px;left:0;width:20%}
#draw{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}.path,.currentPath{fill:none;stroke-linecap:round;stroke-linejoin:round}.path{stroke-width:5;opacity:.7}.currentPath{stroke:#333;stroke-width:5;opacity:.7}
#status{text-align:center;font-weight:700;min-height:28px;margin-top:16px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px;font-weight:700}.clear{font-size:23px;color:#16803c}.note{text-align:center;font-size:12px;color:#666;margin-top:10px}
</style></head><body><div id="app"><h1>一筆パズル</h1><div class="rule">5マスを一筆書きで埋めよう<br><strong>同じ形を3つ以上</strong>作ればクリア！</div>
<div id="board"><div class="grid"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
<div class="wall wall-v" style="left:40%"></div><div class="wall wall-v" style="left:80%;top:20%;height:20%"></div><div class="wall wall-v" style="left:60%;top:40%;height:20%"></div><div class="wall wall-v" style="left:60%;top:60%;height:20%"></div><div class="wall wall-h" style="left:0;top:60%"></div>
<svg id="draw" viewBox="0 0 500 500" preserveAspectRatio="none"></svg></div>
<div id="status">5マスを一筆書きで埋めてください</div><button id="reset">リセット</button>
<div class="note">色のついたマス＝埋めたマス。埋めたマスをもう一度なぞると、その指定したマスだけ空白に戻せます。</div></div>
<script>
const N=5,TARGET=5,GROUPS=5,board=document.getElementById('board'),svg=document.getElementById('draw'),status=document.getElementById('status'),cells=[...document.querySelectorAll('.cell')];
const walls=[[[0,1],[0,2]],[[1,3],[1,4]],[[2,2],[3,2]],[[3,3],[4,3]],[[3,0],[4,0]]],colors=['#e74c3c','#3478f6','#27ae60','#e67e22','#8e44ad'];
let current=[],groups=[],drawing=false;
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1], adjacent=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
function blocked(a,b){return walls.some(w=>(same(a,w[0])&&same(b,w[1]))||(same(a,w[1])&&same(b,w[0])))}function used(c){return groups.some(g=>g.some(x=>same(x,c)))}
function cellFromPoint(x,y){const r=board.getBoundingClientRect(),c=Math.floor((x-r.left)/r.width*N),row=Math.floor((y-r.top)/r.height*N);return row<0||row>=N||c<0||c>=N?null:[row,c]}
function center(c){return[c[1]*100+50,c[0]*100+50]}
function paint(){cells.forEach((e,i)=>{e.className='cell';const r=Math.floor(i/N),c=i%N;groups.forEach((g,j)=>{if(g.some(x=>x[0]===r&&x[1]===c))e.classList.add('filled'+(j+1))});if(current.some(x=>x[0]===r&&x[1]===c))e.classList.add('current')})}
function line(points,cls,color){const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points.map(x=>x.join(',')).join(' '));p.setAttribute('class',cls);if(color)p.setAttribute('stroke',color);svg.appendChild(p)}
function draw(){paint();svg.innerHTML='';groups.forEach((g,i)=>line(g.map(center),'path',colors[i]));if(current.length>1)line(current.map(center),'currentPath')}
function start(e){if(groups.length>=GROUPS)return;const c=cellFromPoint(e.clientX,e.clientY);if(!c||used(c))return;drawing=true;current=[c];draw();e.preventDefault()}
function move(e){if(!drawing)return;const c=cellFromPoint(e.clientX,e.clientY);if(!c)return;const last=current[current.length-1];if(same(last,c)||!adjacent(last,c)||blocked(last,c)||used(c))return;const i=current.findIndex(x=>same(x,c));if(i!==-1){
  /* 指定したマスだけを空白にする */
  current.splice(i,1);
  draw();
  e.preventDefault();
  return;
}
current.push(c);draw();e.preventDefault();if(current.length===TARGET){groups.push(current.slice());current=[];draw();check()}}
function end(){if(!drawing)return;drawing=false;if(current.length){current=[];draw();status.textContent='5マスを一筆書きで埋めてください'}}
function shapeKey(path){const v=[];for(let f=0;f<2;f++)for(let r=0;r<4;r++){let p=path.map(([x,y])=>{let a=x,b=f?-y:y;for(let i=0;i<r;i++)[a,b]=[b,-a];return[a,b]});let mx=Math.min(...p.map(x=>x[0])),my=Math.min(...p.map(x=>x[1]));v.push(JSON.stringify(p.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])))}return v.sort()[0]}
function check(){if(groups.length<GROUPS){status.textContent=groups.length+'/'+GROUPS+' グループ完成';return}const c={};groups.forEach(g=>{let k=shapeKey(g);c[k]=(c[k]||0)+1});status.innerHTML=Math.max(...Object.values(c))>=3?'<span class="clear">🎉 CLEAR!</span>':'同じ形を3つ以上作ってください'}
function reset(){current=[];groups=[];status.textContent='5マスを一筆書きで埋めてください';draw()}
board.addEventListener('pointerdown',start);board.addEventListener('pointermove',move);window.addEventListener('pointerup',end);document.getElementById('reset').addEventListener('click',reset);draw();
</script></body></html>
