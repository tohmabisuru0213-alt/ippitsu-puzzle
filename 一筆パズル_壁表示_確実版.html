<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一筆パズル</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f3f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{display:flex;justify-content:center;min-height:100vh}
#app{width:min(92vw,520px);padding:22px 0 36px}
h1{text-align:center;font-size:26px;margin:0 0 8px}
.rule{text-align:center;font-size:14px;line-height:1.6;margin-bottom:18px}
#board{position:relative;width:100%;aspect-ratio:1;background:#fff;border:3px solid #222;overflow:hidden;touch-action:none}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}
.cell{border-right:1px solid #aaa;border-bottom:1px solid #aaa}
.cell:nth-child(5n){border-right:0}.cell:nth-child(n+21){border-bottom:0}

/* 壁はSVGではなくHTMLのdivとして表示 */
.wall{position:absolute;background:#111;z-index:10;pointer-events:none}
.wall-v{width:10px;top:0;height:20%}
.wall-h{height:10px;left:0;width:20%}

#draw{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
.path{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.current{fill:none;stroke:#111;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
#status{text-align:center;font-weight:700;min-height:28px;margin-top:16px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px;font-weight:700}
.clear{font-size:23px;color:#16803c}
.note{text-align:center;font-size:12px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div id="app">
<h1>一筆パズル</h1>
<div class="rule">5マスの一筆書きを5つ作ろう<br><strong>同じ形を3つ以上</strong>作ればクリア！</div>

<div id="board">
  <div class="grid">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>

  <!-- 目で見て分かる太い壁 -->
  <div class="wall wall-v" style="left:40%;"></div>
  <div class="wall wall-v" style="left:80%;top:20%;height:20%;"></div>
  <div class="wall wall-v" style="left:60%;top:40%;height:20%;"></div>
  <div class="wall wall-v" style="left:60%;top:60%;height:20%;"></div>
  <div class="wall wall-h" style="left:0;top:60%;"></div>

  <svg id="draw" viewBox="0 0 500 500" preserveAspectRatio="none"></svg>
</div>

<div id="status">5マスを一筆書きしてください</div>
<button id="reset">リセット</button>
<div class="note">太い黒線が「壁」です。壁を越えて移動できません。</div>
</div>

<script>
const N=5,TARGET=5,GROUPS=5;
const board=document.getElementById('board');
const svg=document.getElementById('draw');
const status=document.getElementById('status');

/* 壁の位置：[マスA, マスB] */
const walls=[
 [[0,1],[0,2]],
 [[1,3],[1,4]],
 [[2,2],[3,2]],
 [[3,3],[4,3]],
 [[3,0],[4,0]]
];

let current=[],groups=[],drawing=false;

function same(a,b){return a[0]===b[0]&&a[1]===b[1]}
function adjacent(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1}
function blocked(a,b){
 return walls.some(w=>(same(a,w[0])&&same(b,w[1]))||(same(a,w[1])&&same(b,w[0])));
}
function used(c){return groups.some(g=>g.some(x=>same(x,c)))}

function cellFromPoint(x,y){
 const r=board.getBoundingClientRect();
 const c=Math.floor((x-r.left)/r.width*N);
 const row=Math.floor((y-r.top)/r.height*N);
 if(row<0||row>=N||c<0||c>=N)return null;
 return [row,c];
}
function center(c){return [c[1]*100+50,c[0]*100+50]}

function draw(){
 svg.innerHTML='';
 const colors=['#e74c3c','#3478f6','#27ae60','#e67e22','#8e44ad'];
 groups.forEach((g,i)=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  p.setAttribute('points',g.map(center).map(x=>x.join(',')).join(' '));
  p.setAttribute('class','path');
  p.setAttribute('stroke',colors[i]);
  svg.appendChild(p);
 });
 if(current.length){
  const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  p.setAttribute('points',current.map(center).map(x=>x.join(',')).join(' '));
  p.setAttribute('class','current');
  svg.appendChild(p);
 }
}

function start(e){
 if(groups.length>=GROUPS)return;
 const c=cellFromPoint(e.clientX,e.clientY);
 if(!c||used(c))return;
 drawing=true;current=[c];draw();e.preventDefault();
}
function move(e){
 if(!drawing)return;
 const c=cellFromPoint(e.clientX,e.clientY);
 if(!c)return;
 const last=current[current.length-1];
 if(same(last,c)||!adjacent(last,c)||blocked(last,c)||used(c)||current.some(x=>same(x,c)))return;
 current.push(c);draw();e.preventDefault();
}
function end(){
 if(!drawing)return;
 drawing=false;
 if(current.length===TARGET){
  groups.push(current.slice());current=[];draw();check();
 }else{
  current=[];draw();
  status.textContent='5マスちょうどで一筆書きしてください';
 }
}
function shapeKey(path){
 const variants=[];
 for(let flip=0;flip<2;flip++)for(let rot=0;rot<4;rot++){
  let p=path.map(([x,y])=>{
   let a=x,b=flip?-y:y;
   for(let i=0;i<rot;i++)[a,b]=[b,-a];
   return[a,b];
  });
  const minX=Math.min(...p.map(x=>x[0])),minY=Math.min(...p.map(x=>x[1]));
  p=p.map(([x,y])=>[x-minX,y-minY]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  variants.push(JSON.stringify(p));
 }
 return variants.sort()[0];
}
function check(){
 if(groups.length<GROUPS){
  status.textContent=groups.length+'/'+GROUPS+' グループ完成';
  return;
 }
 const count={};
 groups.forEach(g=>{const k=shapeKey(g);count[k]=(count[k]||0)+1});
 const max=Math.max(...Object.values(count));
 status.innerHTML=max>=3?'<span class="clear">🎉 CLEAR!</span>':'同じ形を3つ以上作ってください';
}
function reset(){
 current=[];groups=[];status.textContent='5マスを一筆書きしてください';draw();
}
board.addEventListener('pointerdown',start);
board.addEventListener('pointermove',move);
window.addEventListener('pointerup',end);
document.getElementById('reset').addEventListener('click',reset);
draw();
</script>
</body>
</html>
